<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="เครื่องมือเรียนภาษาสำหรับผู้พูดภาษาไทย">
<meta name="theme-color" content="#ECEFF1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121C22" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<link rel="icon" href="/icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ห้องเรียนภาษาอังกฤษ">
<title>ห้องเรียนภาษาอังกฤษ</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Charis+SIL:ital,wght@0,400;0,700;1,400&family=Sarabun:wght@400;600&display=swap">
<style>
:root{
  --paper:#ECEFF1;
  --paper-2:#E3E8EB;
  --paper-3:#D9E0E4;
  --ink:#16232B;
  --ink-2:#4B5C66;
  --ink-3:#72848E;
  --rule:#C7D0D6;
  --rule-strong:#8FA0AA;
  --teal:#0F6E7A;
  --teal-deep:#0A525B;
  --teal-wash:#BFE3E6;
  --teal-faint:#D9EDEF;
  --brick:#A8412B;
  --brick-faint:#F0DED8;
  --mustard:#9A7418;
  --mustard-faint:#EDE4CE;
  --on-teal:#F4FAFB;

  --serif:"Charter","Charis SIL","Iowan Old Style",Palatino,Georgia,"Times New Roman",serif;
  --thsans:"Sarabun","Noto Sans Thai","Thonburi",sans-serif;
  --sans:"Avenir Next","PingFang TC","Microsoft JhengHei","Noto Sans TC","Hiragino Sans",sans-serif;

  --measure:62ch;
  --col:760px;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#121C22;
    --paper-2:#18242B;
    --paper-3:#1F2D35;
    --ink:#DFE7EB;
    --ink-2:#93A5B0;
    --ink-3:#74868F;
    --rule:#2D3C45;
    --rule-strong:#4A5F6A;
    --teal:#5CBCC6;
    --teal-deep:#8AD5DC;
    --teal-wash:#174B54;
    --teal-faint:#16323A;
    --brick:#DE7F63;
    --brick-faint:#32201B;
    --mustard:#CCA13F;
    --mustard-faint:#2C2517;
    --on-teal:#08181C;
  }
}
:root[data-theme="dark"]{
  --paper:#121C22;
  --paper-2:#18242B;
  --paper-3:#1F2D35;
  --ink:#DFE7EB;
  --ink-2:#93A5B0;
  --ink-3:#74868F;
  --rule:#2D3C45;
  --rule-strong:#4A5F6A;
  --teal:#5CBCC6;
  --teal-deep:#8AD5DC;
  --teal-wash:#174B54;
  --teal-faint:#16323A;
  --brick:#DE7F63;
  --brick-faint:#32201B;
  --mustard:#CCA13F;
  --mustard-faint:#2C2517;
  --on-teal:#08181C;
}

*{box-sizing:border-box}
body{
  margin:0;
  background:var(--paper);
  color:var(--ink);
  font-family:var(--thsans),var(--sans);
  font-size:15px;
  line-height:1.7;
  -webkit-font-smoothing:antialiased;
}
button{font:inherit;color:inherit;background:none;border:none;padding:0;cursor:pointer}
input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--teal);outline-offset:2px;border-radius:2px}

/* ---------- shell ---------- */
.shell{display:flex;align-items:flex-start;min-height:100vh}

.rail{
  width:264px;flex:0 0 264px;
  border-right:1px solid var(--rule);
  background:var(--paper-2);
  min-height:100vh;
  position:sticky;top:0;
  max-height:100vh;overflow-y:auto;
  padding:22px 0 40px;
}
.rail-head{
  display:flex;gap:2px;padding:0 18px 14px;
}
.rail-tab{
  font-size:12px;letter-spacing:.09em;
  padding:5px 9px;color:var(--ink-3);
  border-bottom:2px solid transparent;
}
.rail-tab[aria-pressed="true"]{color:var(--ink);border-bottom-color:var(--teal)}
.rail-tab:hover{color:var(--ink)}

.rail-empty{padding:4px 18px;color:var(--ink-3);font-size:13px;line-height:1.75}

.hist-item{
  display:block;width:100%;text-align:left;
  padding:11px 18px;border-top:1px solid var(--rule);
}
.hist-item:first-of-type{border-top:none}
.hist-item:hover{background:var(--paper-3)}
.hist-item[aria-current="true"]{background:var(--paper-3);box-shadow:inset 3px 0 0 var(--teal)}
.hist-title{font-size:14px;line-height:1.5;margin-bottom:3px}
.hist-meta{font-size:11.5px;color:var(--ink-3);letter-spacing:.02em;font-variant-numeric:tabular-nums}
.hist-row{display:flex;align-items:stretch;border-top:1px solid var(--rule)}
.hist-row:first-child{border-top:none}
.hist-row .hist-item{border-top:none}
.hist-del{
  flex:0 0 auto;padding:0 14px;color:var(--ink-3);font-size:12px;
  opacity:0;transition:opacity .12s;
}
.hist-row:hover .hist-del,.hist-del:focus-visible{opacity:1}
.hist-del.armed{opacity:1;color:var(--brick);font-weight:600}
@media (hover:none){.hist-del{opacity:1}}

/* ---------- main ---------- */
.main{flex:1 1 auto;min-width:0;padding:0 28px 140px}
.col{max-width:var(--col);margin:0 auto}

.masthead{
  display:flex;flex-wrap:wrap;gap:14px 20px;align-items:baseline;
  padding:26px 0 16px;border-bottom:1px solid var(--rule);
}
.wordmark{font-family:var(--serif);font-size:21px;letter-spacing:.01em;margin:0;font-weight:700}
.wordmark em{font-style:normal;color:var(--teal)}
.tagline{font-size:12.5px;color:var(--ink-3);letter-spacing:.02em}
.build{font-size:11px;color:var(--ink-3);letter-spacing:.06em;font-variant-numeric:tabular-nums;border:1px solid var(--rule);border-radius:2px;padding:1px 8px;white-space:nowrap}
.masthead-sp{flex:1 1 auto}

.voicebar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;padding:12px 0;border-bottom:1px solid var(--rule)}
.seg{display:flex;border:1px solid var(--rule-strong);border-radius:2px;overflow:hidden}
.seg button{
  padding:3px 10px;font-size:12px;color:var(--ink-2);
  border-right:1px solid var(--rule-strong);white-space:nowrap;
}
.seg button:last-child{border-right:none}
.seg button[aria-pressed="true"]{background:var(--teal);color:var(--on-teal)}
.seg button:not([aria-pressed="true"]):hover{background:var(--paper-3)}
.voicename{font-size:11.5px;color:var(--ink-3);letter-spacing:.02em}
.voicename b{font-weight:500;color:var(--ink-2);font-family:var(--serif)}
.drawer-btn{display:none}

/* composer */
.composer{padding:22px 0 20px;border-bottom:1px solid var(--rule)}
.composer-row{display:flex;gap:10px;flex-wrap:wrap}
#topic{
  flex:1 1 260px;min-width:0;
  background:var(--paper-2);
  border:1px solid var(--rule-strong);
  border-radius:2px;padding:9px 12px;font-size:15px;
}
#topic::placeholder{color:var(--ink-3)}
#topic:focus{outline:none;border-color:var(--teal);box-shadow:0 0 0 3px var(--teal-faint)}
.btn-go{
  flex:0 0 auto;background:var(--teal);color:var(--on-teal);
  padding:9px 20px;border-radius:2px;font-size:14px;letter-spacing:.04em;
}
.btn-go:hover{background:var(--teal-deep)}
.btn-go[disabled]{background:var(--rule-strong);cursor:default}
.btn-stop{flex:0 0 auto;padding:9px 16px;border:1px solid var(--rule-strong);border-radius:2px;font-size:13px;color:var(--ink-2)}
.btn-stop:hover{border-color:var(--brick);color:var(--brick)}

.status{display:flex;align-items:center;gap:10px;margin-top:14px;font-size:13px;color:var(--ink-2)}
.pulse{
  width:7px;height:7px;border-radius:50%;background:var(--teal);flex:0 0 auto;
  animation:pulse 1.3s ease-in-out infinite;
}
@keyframes pulse{0%,100%{opacity:.25}50%{opacity:1}}
.status-stage{font-family:var(--serif);color:var(--ink)}
.status-count{font-variant-numeric:tabular-nums;color:var(--ink-3);font-size:12px}

.notice{
  margin-top:14px;padding:10px 14px;font-size:13.5px;line-height:1.65;
  border-left:3px solid var(--brick);background:var(--brick-faint);color:var(--ink);
}
.notice button{color:var(--brick);text-decoration:underline;text-underline-offset:3px;margin-left:8px}
.notice .code{display:block;margin-top:7px;font-family:var(--serif);font-size:11.5px;color:var(--ink-2);letter-spacing:.03em}
.diag{margin-top:14px;font-size:11.5px;color:var(--ink-3)}
.diag summary{cursor:pointer;letter-spacing:.08em;padding:2px 0}
.diag dl{margin:9px 0 0;display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 14px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px;line-height:1.6}
.diag dt{color:var(--ink-3);white-space:nowrap}
.diag dd{margin:0;color:var(--ink-2);overflow-wrap:anywhere}

/* ---------- lesson ---------- */
.lesson{padding-top:8px}
.lesson-head{padding:26px 0 18px}
h1.title{
  font-family:var(--sans);font-size:27px;line-height:1.35;font-weight:600;
  margin:0 0 10px;text-wrap:balance;letter-spacing:-.005em;
}
.summary{margin:0;color:var(--ink-2);font-size:15px;max-width:var(--measure)}
.lesson-topic{font-size:11.5px;letter-spacing:.1em;color:var(--ink-3);margin-bottom:12px}

section.block{padding:24px 0;border-top:1px solid var(--rule)}
h2.label{
  font-size:11px;letter-spacing:.16em;font-weight:600;color:var(--ink-3);
  margin:0 0 14px;
}
.prose{margin:0;max-width:var(--measure);font-size:15.5px}
.prose+.prose{margin-top:12px}

/* clickable english */
.en{
  font-family:var(--serif);
  border-bottom:1px solid var(--rule-strong);
  cursor:pointer;padding:0 1px;border-radius:2px;
  transition:background-color .1s,color .1s;
}
.en:hover{background:var(--teal-faint)}
.en.on{background:var(--teal);color:var(--on-teal);border-bottom-color:transparent}
.tok{font-family:var(--serif);cursor:pointer;border-radius:2px;padding:0 .5px}
.tok:hover{background:var(--teal-faint)}
.tok.on{background:var(--teal);color:var(--on-teal)}

/* compare table */
.tablewrap{overflow-x:auto;max-width:100%}
table.compare{border-collapse:collapse;width:100%;min-width:420px}
table.compare th{
  text-align:left;font-size:11px;letter-spacing:.14em;font-weight:600;
  color:var(--ink-3);padding:0 12px 7px 0;
  border-bottom:2px solid var(--rule-strong);
}
table.compare th:last-child,table.compare td:last-child{padding-right:0}
table.compare td{
  padding:11px 12px 11px 0;border-bottom:1px solid var(--rule);
  vertical-align:baseline;font-size:14.5px;
}
td.c-en{white-space:nowrap}
td.c-en .en{font-size:16.5px}
td.c-ipa{font-family:var(--serif);color:var(--ink-2);white-space:nowrap;font-size:14px}
td.c-note{color:var(--ink);min-width:200px}
td.c-add{width:1%;text-align:right;white-space:nowrap}
.addbtn{
  font-size:11px;letter-spacing:.06em;color:var(--ink-3);
  border:1px solid var(--rule);border-radius:2px;padding:2px 7px;
}
.addbtn:hover{border-color:var(--teal);color:var(--teal)}
.addbtn.saved{color:var(--teal);border-color:var(--teal-wash);background:var(--teal-faint)}

/* examples */
.ex{display:flex;gap:12px;padding:13px 0;border-bottom:1px solid var(--rule)}
.ex:last-child{border-bottom:none}
.ex:first-child{padding-top:0}
.play{
  flex:0 0 auto;width:26px;height:26px;border:1px solid var(--rule-strong);
  border-radius:50%;display:grid;place-items:center;margin-top:2px;color:var(--ink-2);
}
.play:hover{border-color:var(--teal);color:var(--teal)}
.play.on{background:var(--teal);border-color:var(--teal);color:var(--on-teal)}
.play svg{width:9px;height:9px;display:block}
.ex-body{min-width:0}
.ex-en{font-family:var(--serif);font-size:17px;line-height:1.6;max-width:var(--measure)}
.ex-zh{color:var(--ink-2);font-size:13.5px;margin-top:4px;max-width:var(--measure)}

/* traps */
.trap{border-left:3px solid var(--brick);padding:2px 0 2px 15px;margin-bottom:18px}
.trap:last-child{margin-bottom:0}
.trap-point{font-size:14.5px;margin-bottom:7px;max-width:var(--measure)}
.wr{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline;font-size:15.5px;margin-bottom:3px}
.wr-tag{
  font-size:10.5px;letter-spacing:.1em;flex:0 0 auto;width:22px;
  font-family:var(--sans);
}
.wr-x .wr-tag{color:var(--brick)}
.wr-o .wr-tag{color:var(--teal)}
.wr-x .en{text-decoration:line-through;text-decoration-color:var(--brick);text-decoration-thickness:1px}
.trap-why{color:var(--ink-2);font-size:13.5px;margin-top:6px;max-width:var(--measure)}

/* collocations */
.colls{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:1px 26px}
.coll{display:flex;gap:10px;align-items:baseline;padding:8px 0;border-bottom:1px solid var(--rule)}
.coll-en{font-size:15.5px;min-width:0}
.coll-zh{color:var(--ink-2);font-size:12.5px;margin-left:auto;text-align:right;flex:0 0 auto}

/* notes */
.notes{border-left:3px solid var(--mustard);padding:2px 0 2px 15px;background:transparent}
.notes .prose{font-size:14.5px;color:var(--ink)}

/* ---------- vocab ---------- */
.vocab-head{display:flex;flex-wrap:wrap;gap:12px;align-items:baseline;padding:26px 0 16px}
.vocab-head h1{font-size:24px;font-weight:600;margin:0}
.vocab-count{font-size:12.5px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.vocab-actions{margin-left:auto;display:flex;gap:8px}
.btn-ghost{border:1px solid var(--rule-strong);border-radius:2px;padding:5px 12px;font-size:12.5px;color:var(--ink-2)}
.btn-ghost:hover{border-color:var(--teal);color:var(--teal)}
.vrow{display:flex;flex-wrap:wrap;gap:4px 14px;align-items:baseline;padding:12px 0;border-top:1px solid var(--rule)}
.vrow .v-en{font-size:17px}
.v-ipa{font-family:var(--serif);color:var(--ink-2);font-size:13.5px}
.v-zh{color:var(--ink);font-size:13.5px;flex:1 1 180px;min-width:0}
.v-src{font-size:11.5px;color:var(--ink-3)}
.v-src:hover{color:var(--teal);text-decoration:underline;text-underline-offset:3px}
.v-del{font-size:11.5px;color:var(--ink-3)}
.v-del:hover{color:var(--brick)}
.v-del.armed{color:var(--brick);font-weight:600}

/* ---------- empty ---------- */
.empty{padding:34px 0 10px;max-width:var(--measure)}
.empty h1{font-family:var(--sans);font-size:25px;font-weight:600;margin:0 0 12px;text-wrap:balance}
.empty p{color:var(--ink-2);margin:0 0 24px;font-size:15px}
.contents{border-top:1px solid var(--rule);margin-bottom:26px}
.contents div{display:flex;gap:14px;align-items:baseline;padding:8px 0;border-bottom:1px solid var(--rule);font-size:13.5px}
.contents dt{flex:0 0 88px;color:var(--ink);margin:0}
.contents dd{margin:0;color:var(--ink-2);font-size:13px}
.try-label{font-size:11px;letter-spacing:.16em;color:var(--ink-3);margin-bottom:10px}
.try{display:flex;flex-direction:column;gap:1px}
.try button{
  text-align:left;padding:11px 0;border-top:1px solid var(--rule);
  font-size:14.5px;display:flex;gap:10px;align-items:baseline;
}
.try button:last-child{border-bottom:1px solid var(--rule)}
.try button:hover{color:var(--teal)}
.try .arrow{color:var(--teal);flex:0 0 auto;font-family:var(--serif)}

/* ---------- speech pill ---------- */
.pill{
  position:fixed;left:50%;bottom:22px;transform:translateX(-50%);
  display:flex;align-items:center;gap:11px;
  background:var(--ink);color:var(--paper);
  padding:8px 16px;border-radius:999px;
  font-size:13px;max-width:min(560px,calc(100vw - 32px));
  box-shadow:0 6px 24px rgba(10,25,32,.22);
  z-index:50;
}
.pill-text{font-family:var(--serif);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill-voice{font-size:11px;opacity:.6;white-space:nowrap;flex:0 0 auto}
.pill-stop{font-size:11px;opacity:.75;flex:0 0 auto;border-left:1px solid rgba(255,255,255,.2);padding-left:11px}
.pill-stop:hover{opacity:1}
.pill-enter{animation:pillin .18s ease-out}
@keyframes pillin{from{opacity:0;transform:translateX(-50%) translateY(6px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}

.ver{opacity:.55;font-variant-numeric:tabular-nums;letter-spacing:.04em}
.footnote{padding:26px 0 0;border-top:1px solid var(--rule);font-size:12.5px;color:var(--ink-3);max-width:var(--measure)}

/* ---------- responsive ---------- */
@media (max-width:840px){
  .shell{display:block}
  .rail{
    display:none;width:auto;flex:none;position:static;max-height:none;min-height:0;
    border-right:none;border-bottom:1px solid var(--rule);padding:14px 0 18px;
  }
  .rail.open{display:block}
  .main{padding:0 16px 150px}
  .drawer-btn{
    display:inline-block;font-size:12px;letter-spacing:.06em;color:var(--ink-2);
    border:1px solid var(--rule-strong);border-radius:2px;padding:3px 10px;
  }
  h1.title{font-size:23px}
  td.c-en{white-space:normal}
  .colls{grid-template-columns:1fr;gap:0}
}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}
}
/* ---------- 語言切換 ---------- */
.langbar{display:flex;border:1px solid var(--rule-strong);border-radius:2px;overflow:hidden;flex:0 0 auto}
.langbar a,.langbar span{
  padding:5px 11px;font-size:12px;color:var(--ink-2);text-decoration:none;
  border-right:1px solid var(--rule-strong);white-space:nowrap;line-height:1.6;
}
.langbar a:last-child,.langbar span:last-child{border-right:none}
.langbar a:hover{background:var(--paper-3);color:var(--ink)}
.langbar .on{background:var(--accent);color:var(--on-accent)}
.langbar .soon{color:var(--ink-3);opacity:.45;cursor:not-allowed}
.logout{font-size:11.5px;color:var(--ink-3);letter-spacing:.06em;padding:4px 2px}
.logout:hover{color:var(--brick)}
@media (max-width:840px){
  .langbar a,.langbar span{padding:7px 13px;font-size:12.5px}
  .logout{padding:8px 4px}
}
</style>

</head>
<body>
<div id="root"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="/shared/ll.js"></script>
<script>
(function () {
  "use strict";

  var h = React.createElement;
  var Frag = React.Fragment;
  var useState = React.useState;
  var useEffect = React.useEffect;
  var useRef = React.useRef;
  var useCallback = React.useCallback;


  /* ====== speech ====== */
  // 發音走 /api/tts（Google Cloud TTS），實作在 /shared/ll.js。
  // 原本的 window.speechSynthesis 已經拿掉：品質看裝置，泰文更是常常沒有語音。

  function clean(word) {
    return String(word).replace(/^[^A-Za-z0-9'’]+/, "").replace(/[^A-Za-z0-9'’%]+$/, "");
  }

  /* ============================ storage ============================ */

  // Lessons live in this browser's localStorage: one key per lesson plus a
  // lightweight index, so opening the history list never parses every lesson.
  // 沒有示範課程：歷史存在伺服器，首次開啟本來就是空的
  var SEED = { index: [], vocab: [], lessons: {} };

  var Store = (function () {
    var healthy = true;
    var K = { index: "ength.index", vocab: "ength.vocab", seeded: "ength.seeded" };
    function lk(id) { return "ength.lesson." + id; }

    function read(key, fallback) {
      try {
        var raw = window.localStorage.getItem(key);
        if (raw == null) return fallback;
        return JSON.parse(raw);
      } catch (e) { healthy = false; return fallback; }
    }
    function write(key, value) {
      try { window.localStorage.setItem(key, JSON.stringify(value)); return true; }
      catch (e) { healthy = false; return false; }
    }
    function drop(key) {
      try { window.localStorage.removeItem(key); } catch (e) { healthy = false; }
    }

    return {
      ok: function () { return healthy; },
      // First visit gets the two lessons this page shipped with, so it opens
      // on something real instead of an empty shell.
      seed: function () {
        if (read(K.seeded, null)) return;
        if (!read(K.index, null)) {
          SEED.index.forEach(function (it) {
            if (SEED.lessons[it.id]) write(lk(it.id), SEED.lessons[it.id]);
          });

  function plain(text) {

  function EnWord(props) {
    var speakKey = props.speakKey;

    var cls = (props.cls || "en") + (props.speaking === speakKey ? " on" : "");
    return h("span", {
      className: cls,
      role: "button",

      title: "แตะเพื่อฟังเสียง",
      onClick: function (e) { e.stopPropagation(); onSpeak(text, speakKey); },
      onKeyDown: function (e) {

          e.preventDefault(); e.stopPropagation(); onSpeak(text, speakKey);
        }
      }
    }, text);
  }

  // Splits a Chinese paragraph on <en>...</en> and makes each tagged word clickable.
  function renderWithEn(text, onSpeak, speaking, keyBase) {
    var parts = String(text).split(/(<en>[\s\S]*?<\/en>)/g);
    return parts.map(function (part, i) {
      var m = part.match(/^<en>([\s\S]*?)<\/en>$/);
      if (!m) return h("span", { key: keyBase + "-t" + i }, part);
      var word = m[1];
      return h(EnWord, {
        key: keyBase + "-e" + i,
        text: word,
        speakKey: keyBase + "-e" + i,
        onSpeak: onSpeak,
        speaking: speaking
      });
    });
  }

  // Splits an English sentence into individually clickable word tokens.
  function renderTokens(sentence, onSpeak, speaking, keyBase) {
    var tokens = String(sentence).split(/(\s+)/);
    return tokens.map(function (tok, i) {
      if (/^\s+$/.test(tok) || tok === "") return h("span", { key: keyBase + "-s" + i }, tok);
      var bare = clean(tok);
      if (!bare) return h("span", { key: keyBase + "-p" + i }, tok);
      var k = keyBase + "-w" + i;
      return h("span", {
        key: k,
        className: "tok" + (speaking === k ? " on" : ""),
        role: "button",
        tabIndex: 0,
        title: "อ่านเฉพาะคำนี้",
        onClick: function (e) { e.stopPropagation(); onSpeak(bare, k); },
        onKeyDown: function (e) {
          if (e.key === "Enter" || e.key === " ") {
            e.preventDefault(); e.stopPropagation(); onSpeak(bare, k);
          }
        }
      }, tok);
    });
  }

    /* ---- speech ---- */
    var stopSpeech = useCallback(function () {
      queueRef.current = null;

      // 失敗靜默降級成不發音 —— 點一個詞念不出來就跳錯誤，讀一段課文會被打斷十次
      LL.speech.speak("en", text, key, { rate: rate, voice: (accent === "en-GB" ? "uk" : "us") })
        .then(function () {

    var playQueue = useCallback(function (items) {
      if (!items.length) return;

    /* ---- persistence ---- */
    function saveLesson(id, topicText, data) {
      var entry = {
        id: id,

    function addWord(en, ipa, tr) {
      var key = en.toLowerCase();

      LL.generate("th-en", t, { signal: ctl.signal }).then(function (r) {

            return h("div", { className: "coll", key: "col" + i },
              h("span", { className: "coll-en" }, h(EnWord, {
                text: en, speakKey: "col" + i, onSpeak: onSpeak, speaking: speaking
              })),
              h("span", { className: "coll-zh" }, str(c.tr)),
              h("button", {
                type: "button",
                className: "addbtn" + (saved ? " saved" : ""),
                "aria-label": saved ? ("「" + en + "」อยู่ในรายการแล้ว") : ("เพิ่ม「" + en + "」ลงในรายการคำศัพท์"),
                onClick: function () { if (!saved) addWord(en, "", c.zh); }
              }, saved ? "เก็บแล้ว" : "＋")
            );
          }))
        ) : null,

        notes ? h("section", { className: "block" },
          h("h2", { className: "label" }, "บันทึกเพิ่มเติม"),
          h("div", { className: "notes" },
            h("p", { className: "prose" }, renderWithEn(notes, onSpeak, speaking, "notes"))
          )
        ) : null,

        h("div", { className: "block" },
          h("p", { className: "footnote" },
            "บทเรียนสร้างโดย Gemini ตามหัวข้อที่คุณใส่ การใช้งานและการออกเสียงควรถือเป็นจุดเริ่มต้น ไม่ใช่ข้อสรุป คำสำคัญควรตรวจสอบกับพจนานุกรมอีกครั้ง",
            h("span", { className: "ver" }, "　v" + LL.VERSION))
        )
      );
    }

    function VocabView() {
      var items = vocab;
      return h("div", null,
        h("div", { className: "vocab-head" },
          h("h1", null, "รายการคำศัพท์"),
          h("span", { className: "vocab-count" }, items.length + " คำ"),
          h("div", { className: "vocab-actions" },
            items.length ? h("button", {
              type: "button", className: "btn-ghost",
              onClick: function () {
                playQueue(items.map(function (v, i) {
                  return { text: str(v.en), key: "vq" + i };
                }));
              }
            }, "เล่นต่อเนื่อง") : null,
            nowPlaying ? h("button", {
              type: "button", className: "btn-ghost", onClick: stopSpeech
            }, "หยุด") : null
          )
        ),
        !items.length
          ? h("p", { className: "rail-empty", style: { padding: "0" } },
              "ในตารางเปรียบเทียบและคำที่ใช้คู่กันบ่อย จะมีปุ่ม「+ เก็บ」อยู่ด้านขวา กดแล้วคำนั้นจะถูกเก็บมาที่นี่ สะสมข้ามบทเรียนได้")
          : items.map(function (v, i) {
              var k = "vq" + i;
              var armKey = "v:" + v.en;
              return h("div", { className: "vrow", key: "v" + i },
                h("span", { className: "v-en" }, h(EnWord, {
                  text: str(v.en), speakKey: k, onSpeak: onSpeak, speaking: speaking
                })),
                str(v.ipa) ? h("span", { className: "v-ipa" }, str(v.ipa)) : null,
                h("span", { className: "v-zh" }, str(v.tr)),
                v.lessonId ? h("button", {
                  type: "button", className: "v-src",
                  onClick: function () { openLesson(v.lessonId); }
                }, str(v.lessonTitle) || "กลับไปบทเรียน") : null,
                h("button", {
                  type: "button",
                  className: "v-del" + (armed === armKey ? " armed" : ""),
                  onClick: function () {
                    if (armed !== armKey) { setArmed(armKey); return; }
                    setArmed(null);
                    writeVocab(vocabRef.current.filter(function (x) { return x.en !== v.en; }));
                  },
                  onBlur: function () { if (armed === armKey) setArmed(null); }
                }, armed === armKey ? "ยืนยัน" : "ลบออก")
              );
            })
      );
    }

    var TRY = [
      "ทำไมต้องเติม -s ท้ายคำนาม",
      "ภาษาอังกฤษที่ใช้ในการทำงาน",
      "a กับ the ใช้ต่างกันอย่างไร"
    ];

    function EmptyView() {
      return h("div", { className: "empty" },
        h("h1", null, "ใส่หัวข้อเข้ามา แล้วรับบทเรียนที่ฟังเสียงได้ทุกคำ"),
        h("p", null, "ไม่ว่าจะเป็นความหมายของคำเดียว คำใกล้เคียงที่สับสนกันง่าย หรือศัพท์เฉพาะทาง ถามได้หมด ทุกบทเรียนมี 6 ส่วนเสมอ:"),
        h("dl", { className: "contents" },
          h("div", null, h("dt", null, "คำอธิบายหลัก"), h("dd", null, "การใช้งานหลัก ความหมาย ทางการหรือไม่ทางการ")),
          h("div", null, h("dt", null, "ตารางเปรียบเทียบ"), h("dd", null, "ความต่างของคำใกล้เคียง พร้อมสัทอักษร IPA")),
          h("div", null, h("dt", null, "ประโยคตัวอย่าง"), h("dd", null, "สถานการณ์จริง แตะทีละคำเพื่อฟังเสียง")),
          h("div", null, h("dt", null, "ข้อผิดพลาดที่พบบ่อย"), h("dd", null, "ข้อผิดพลาดที่คนไทยทำจริง")),
          h("div", null, h("dt", null, "คำที่ใช้คู่กันบ่อย"), h("dd", null, "สำนวนที่เจ้าของภาษาใช้จริง")),
          h("div", null, h("dt", null, "บันทึกเพิ่มเติม"), h("dd", null, "ที่มาของคำ การเน้นเสียง ความต่างอังกฤษ-อเมริกัน"))
        ),
        h("div", { className: "try-label" }, "ลองดู"),
        h("div", { className: "try" }, TRY.map(function (t, i) {
          return h("button", {
            key: "try" + i, type: "button",
            onClick: function () { setTopic(t); generate(t, false); }
          }, h("span", { className: "arrow" }, "→"), h("span", null, t));
        }))
      );
    }

    function Rail() {
      return h("aside", { className: "rail" + (drawer ? " open" : "") },
        h("div", { className: "rail-head" },
          h("button", {
            type: "button", className: "rail-tab", "aria-pressed": tab === "history",
            onClick: function () { setTab("history"); }
          }, "ประวัติ"),
          h("button", {
            type: "button", className: "rail-tab", "aria-pressed": tab === "vocab",
            onClick: function () { setTab("vocab"); setView("vocab"); setDrawer(false); }
          }, "รายการคำศัพท์ " + (vocab.length || ""))
        ),
        tab === "history"
          ? (index.length
              ? index.map(function (it) {
                  var armKey = "h:" + it.id;
                  return h("div", { className: "hist-row", key: it.id },
                    h("button", {
                      type: "button", className: "hist-item",
                      "aria-current": currentId === it.id && view === "lesson",
                      onClick: function () { openLesson(it.id); }
                    },
                      h("div", { className: "hist-title" }, it.title || it.topic),
                      h("div", { className: "hist-meta" }, fmtDate(it.createdAt))
                    ),
                    h("button", {
                      type: "button",
                      className: "hist-del" + (armed === armKey ? " armed" : ""),
                      "aria-label": "ลบ「" + (it.title || it.topic) + "」",
                      onClick: function () {
                        if (armed !== armKey) { setArmed(armKey); return; }
                        deleteLesson(it.id);
                      },
                      onBlur: function () { if (armed === armKey) setArmed(null); }
                    }, armed === armKey ? "ยืนยัน" : "ลบ")
                  );
                })
              : h("p", { className: "rail-empty" },
                  dbState === "off"
                    ? "เบราว์เซอร์นี้ไม่อนุญาตให้บันทึกข้อมูล (มักเกิดในโหมดไม่ระบุตัวตน) บทเรียนจะอยู่จนกว่าคุณจะปิดแท็บ"
                    : "ยังไม่มีบทเรียน ทุกบทที่สร้างจะถูกเก็บไว้ให้อัตโนมัติ"))
          : h("div", null,
              h("button", {
                type: "button", className: "hist-item",
                onClick: function () { setView("vocab"); setDrawer(false); }
              },
                h("div", { className: "hist-title" }, "เปิดรายการคำศัพท์"),
                h("div", { className: "hist-meta" }, vocab.length + " คำ")
              ),
              vocab.slice(0, 12).map(function (v, i) {
                return h("div", { className: "hist-row", key: "rv" + i },
                  h("button", {
                    type: "button", className: "hist-item",
                    onClick: function () { speak(str(v.en), "rv" + i); }
                  },
                    h("div", { className: "hist-title", style: { fontFamily: "var(--serif)" } }, str(v.en)),
                    h("div", { className: "hist-meta" }, str(v.tr).slice(0, 18))
                  )
                );
              })
            )
      );
    }

    var body;
    if (view === "vocab") body = VocabView();
    else if (lesson) body = LessonView();
    else if (busy) body = null;
    else body = EmptyView();

    return h(Frag, null,
      h("div", { className: "shell" },
        Rail(),
        h("main", { className: "main" },
          h("div", { className: "col" },
            h("div", { className: "masthead" },
              h("h1", { className: "wordmark" }, "ห้องเรียน", h("em", null, "ภาษาอังกฤษ")),
              h("span", { className: "tagline" }, "การใช้งาน・ความหมาย・การออกเสียง"),
              h("span", { className: "masthead-sp" }),
              h("span", { className: "langbar" }, LL.siblings("th").map(function (L) {
                if (L.id === "th-en") return h("span", { key: L.id, className: "on" }, L.label);
                return h("a", { key: L.id, href: L.path }, L.label);
              })),
              h("button", {
                type: "button", className: "logout",
                title: "ออกจากระบบ", "aria-label": "ออกจากระบบ",
                onClick: function () { LL.logout(); }
              }, "ออกจากระบบ"),
              view === "vocab" ? h("button", {
                type: "button", className: "btn-ghost",
                onClick: function () { setView("lesson"); }
              }, "กลับไปบทเรียน") : null
            ),
            VoiceBar(),
            Composer(),
            body
          )
        )
      ),
      nowPlaying ? h("div", { className: "pill pill-enter", role: "status" },
        h("span", { className: "pill-text" }, nowPlaying.text),
        h("span", { className: "pill-voice" }, nowPlaying.voice),
        h("button", { type: "button", className: "pill-stop", onClick: stopSpeech }, "หยุด")
      ) : null
    );
  }

  LL.remember("th-en");

  ReactDOM.createRoot(document.getElementById("root")).render(h(App));
})();
</script>
</body>
</html>
